# Projenin kimlik kartı: adı, sürümü, hangi Python'u istediği
# ve "lycan" yazınca hangi fonksiyonun çalışacağı.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lycan"
version = "0.0.1"
description = "Open-source threat hunter for your own servers and workstations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
lycan = "lycan.cli:main"

[tool.setuptools]
packages = ["lycan"]
